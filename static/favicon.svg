<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#1e2230"/>
  <!-- Book body -->
  <rect x="14" y="14" width="26" height="34" rx="3" fill="#4f8ef7"/>
  <!-- Book spine -->
  <rect x="14" y="14" width="5" height="34" rx="2" fill="#2d6fd4"/>
  <!-- Pages lines -->
  <line x1="23" y1="22" x2="35" y2="22" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="23" y1="28" x2="35" y2="28" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="23" y1="34" x2="31" y2="34" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Camera / screenshot icon -->
  <circle cx="44" cy="44" r="12" fill="#34c759"/>
  <rect x="38" y="41" width="12" height="8" rx="1.5" fill="white"/>
  <circle cx="44" cy="45" r="2.5" fill="#34c759"/>
  <rect x="42" y="39" width="4" height="3" rx="1" fill="white"/>
